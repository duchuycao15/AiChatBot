<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #7fff6e;
    --accent-dim: #2a4a26;
    --user-bubble: #1a2a17;
    --ai-bubble: #1a1a1a;
    --danger: #ff5f5f;
    --sidebar-w: 260px;
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  .sidebar-header .logo span { color: var(--text2); }

  #btn-new {
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  #btn-new:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }
  #btn-new svg { opacity: 0.7; }

  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .conv-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    group: true;
  }
  .conv-item:hover { background: var(--bg3); }
  .conv-item.active { background: var(--accent-dim); }

  .conv-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    line-height: 1.4;
  }
  .conv-item.active .conv-title { color: var(--accent); }

  .conv-del {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.1s, color 0.1s;
    flex-shrink: 0;
  }
  .conv-item:hover .conv-del { opacity: 1; }
  .conv-del:hover { color: var(--danger); }

  .conv-empty {
    padding: 20px 10px;
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    font-family: var(--font-mono);
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text3);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.offline { background: var(--danger); }
  .status-label {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── MAIN ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
  }
  #model-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text2);
  }
  #model-label strong { color: var(--accent); font-weight: 500; }

  /* ── MESSAGES ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-row {
    display: flex;
    padding: 4px 24px;
    gap: 12px;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-family: var(--font-mono);
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-row.user .avatar { background: var(--accent-dim); color: var(--accent); order: 2; }
  .msg-row.assistant .avatar { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

  .bubble {
    max-width: 68%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #2d4a28;
    border-radius: 12px 4px 12px 12px;
    color: var(--text);
  }
  .msg-row.assistant .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
    color: var(--text);
  }

  /* code blocks trong response */
  .bubble code {
    background: #111;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
  }

  .typing-indicator {
    display: flex; gap: 4px; padding: 6px 2px; align-items: center;
  }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text3);
    animation: blink 1.2s ease infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  #welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text3);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: center;
    padding: 40px;
  }
  #welcome .big { font-size: 32px; margin-bottom: 4px; }

  /* ── INPUT ── */
  #input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    min-height: 22px;
  }
  #user-input::placeholder { color: var(--text3); }

  #send-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    color: #0f0f0f;
  }
  #send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
  #send-btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; transform: none; }

  .input-hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
    padding-left: 2px;
    font-family: var(--font-mono);
  }

  /* ── ERROR TOAST ── */
  #toast {
    position: fixed;
    bottom: 90px; right: 24px;
    background: #2a1010;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--font-mono);
    display: none;
    z-index: 100;
    max-width: 320px;
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="logo">LOCAL<span>/</span>AI <span>chat</span></div>
    <button id="btn-new" onclick="newConversation()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Cuộc trò chuyện mới
    </button>
  </div>
  <div class="conv-list" id="conv-list">
    <div class="conv-empty">Chưa có cuộc trò chuyện nào</div>
  </div>
  <div class="sidebar-footer">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-label" id="status-label">Đang kết nối...</div>
  </div>
</aside>

<!-- MAIN -->
<main id="main">
  <div id="topbar">
    <div id="model-label">model: <strong id="model-name">—</strong></div>
  </div>

  <div id="messages">
    <div id="welcome">
      <div class="big">⬡</div>
      <div>Chọn hoặc tạo cuộc trò chuyện mới</div>
      <div style="color: var(--text3); font-size: 11px; margin-top: 4px;">LM Studio phải đang chạy và đã load model</div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-wrap">
      <textarea id="user-input" placeholder="Nhắn gì đó..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Gửi">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter gửi · Shift+Enter xuống dòng</div>
  </div>
</main>

<div id="toast"></div>

<script>
let currentSessionId = null;
let isStreaming = false;

// ── INIT ──
async function init() {
  await checkStatus();
  await loadConversations();
  setInterval(checkStatus, 8000);
}

async function checkStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    const modelName = document.getElementById('model-name');
    if (d.online) {
      dot.className = 'status-dot online';
      const shortModel = d.model.split('/').pop().replace(/-\d{4}-\d{2}-\d{2}$/, '');
      lbl.textContent = shortModel;
      modelName.textContent = shortModel;
    } else {
      dot.className = 'status-dot offline';
      lbl.textContent = 'LM Studio offline';
      modelName.textContent = '—';
    }
  } catch {
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-label').textContent = 'Không kết nối được';
  }
}

// ── CONVERSATIONS ──
async function loadConversations() {
  const r = await fetch('/api/conversations');
  const list = await r.json();
  renderConvList(list);
}

function renderConvList(list) {
  const el = document.getElementById('conv-list');
  if (!list.length) {
    el.innerHTML = '<div class="conv-empty">Chưa có cuộc trò chuyện nào</div>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="conv-item ${c.id === currentSessionId ? 'active' : ''}" onclick="loadSession('${c.id}')">
      <div class="conv-title">${escHtml(c.title)}</div>
      <button class="conv-del" onclick="deleteConversation(event, '${c.id}')" title="Xóa">✕</button>
    </div>
  `).join('');
}

async function newConversation() {
  const r = await fetch('/api/conversations', { method: 'POST' });
  const d = await r.json();
  currentSessionId = d.id;
  clearMessages();
  await loadConversations();
  document.getElementById('user-input').focus();
}

async function loadSession(sid) {
  currentSessionId = sid;
  const r = await fetch(`/api/conversations/${sid}`);
  const msgs = await r.json();
  clearMessages();
  msgs.forEach(m => appendBubble(m.role, m.content));
  scrollBottom();
  await loadConversations();
  document.getElementById('user-input').focus();
}

async function deleteConversation(e, sid) {
  e.stopPropagation();
  await fetch(`/api/conversations/${sid}`, { method: 'DELETE' });
  if (currentSessionId === sid) {
    currentSessionId = null;
    clearMessages();
  }
  await loadConversations();
}

// ── CHAT ──
async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  if (!currentSessionId) await newConversation();

  input.value = '';
  autoResize(input);
  appendBubble('user', text);
  scrollBottom();

  const typingId = appendTyping();
  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSessionId, message: text })
    });

    removeTyping(typingId);
    const aiBubble = appendBubble('assistant', '');
    const bubbleEl = aiBubble.querySelector('.bubble');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        if (data.error) { showToast(data.error); break; }
        if (data.delta) { bubbleEl.textContent += data.delta; scrollBottom(); }
        if (data.done) { await loadConversations(); }
      }
    }
  } catch (err) {
    removeTyping(typingId);
    showToast('Lỗi kết nối: ' + err.message);
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
  }
}

// ── UI HELPERS ──
function appendBubble(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  row.innerHTML = `
    <div class="avatar">${role === 'user' ? 'BẠN' : 'AI'}</div>
    <div class="bubble">${escHtml(content)}</div>
  `;
  msgs.appendChild(row);
  return row;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = id;
  row.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  msgs.appendChild(row);
  scrollBottom();
  return id;
}

function removeTyping(id) {
  document.getElementById(id)?.remove();
}

function clearMessages() {
  document.getElementById('messages').innerHTML = `
    <div id="welcome">
      <div class="big">⬡</div>
      <div>Cuộc trò chuyện mới bắt đầu</div>
    </div>`;
}

function scrollBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── TEXTAREA AUTO-RESIZE ──
const textarea = document.getElementById('user-input');
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
textarea.addEventListener('input', () => autoResize(textarea));
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

init();
</script>
</body>
</html>
